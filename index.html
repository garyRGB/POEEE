<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POEEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="src/errors.js"></script>
</head>
<body>
<div class="app select" id="selectScreen" hidden>
  <div class="title"><span>選擇職業</span></div>
  <div id="classList"></div>
  <button class="btn gold startBtn" id="startBtn" disabled>開始</button>
</div>

<div class="app game" id="game" hidden>
  <div class="top">
    <span class="name" id="heroName"></span>
    <span class="res num"><span>經驗:<b id="exp">0</b></span><span>金幣:<b id="gold">0</b></span><span>鑽石:<b id="diamond">0</b></span></span>
    <button class="rect" disabled>設置</button>
  </div>

  <!-- 戰場：佔掉剩下的高度（#9 先放格子，#10、#11 換成 2D） -->
  <div class="arena" id="battle">
    <div class="field">
      <div class="unit hero">
        <div class="nm m"><span id="heroTitle"></span> <small class="lvTag">Lv<span id="lv"></span></small></div>
        <div class="hpb"><i id="heroHp"></i><span id="heroHpText" class="num"></span></div>
        <div class="hpb mpb"><i id="heroMp"></i><span id="heroMpText" class="num"></span></div>
      </div>
      <div class="monsters" id="monsters"></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="ctrl">
      <div class="items num"><span>藥水 <b id="potions"></b></span><span>復活 <b id="revives"></b></span></div>
      <button class="btn gold soon" id="atlasBtn" aria-disabled="true">輿圖</button>
    </div>
  </div>

  <!-- 一排 8 顆按鈕 -->
  <nav class="nav" id="nav">
    <button class="round" id="bagBtn" disabled>背包</button>
    <button class="round" id="treeBtn" disabled>天賦</button>
    <button class="round" id="autoBtn" disabled>自動</button>
    <button class="round" id="shopBtn" disabled>商店</button>
    <button class="round" id="charBtn">角色</button>
    <button class="round" id="equipBtn">裝備</button>
    <button class="round" id="logBtn" disabled>戰鬥</button>
    <button class="round" id="questBtn" disabled>任務</button>
  </nav>
</div>

<!-- 「角色」頁 -->
<div class="sheet" id="charSheet" hidden>
  <div class="box">
    <h3>角色屬性</h3>
    <div class="stats num" id="stats"></div>
    <div class="acts"><button class="btn line" data-close>關閉</button></div>
  </div>
</div>

<!-- 「裝備」頁 -->
<div class="sheet" id="equipSheet" hidden>
  <div class="box">
    <h3>裝備配置</h3>
    <div class="doll" id="doll"></div>
    <p class="hint">裝備是第 2 階段的事，現在 10 格都是空的。</p>
    <div class="acts"><button class="btn line" data-close>關閉</button></div>
  </div>
</div>

<!-- 「自動」頁面（src/autoPanel.js） -->
<div class="sheet" id="autoSheet" hidden>
  <div class="box">
    <h3>自動規則</h3>
    <label class="autoRow">生命低於 <input id="potPct" type="text" inputmode="numeric" maxlength="2" autocomplete="off"> % 自動喝藥水</label>
    <p class="hint" id="potHint"></p>
    <p class="hint">還沒有存檔功能，重新整理會回到預設值。</p>
    <div class="acts"><button class="btn line" id="autoClose">關閉</button></div>
  </div>
</div>

<!-- 資料先載入，程式再載入：調數值只改 data/。程式一個系統一個檔案，放 src/ -->
<script src="data/classes.js"></script>
<script src="data/monsters.js"></script>
<script src="data/rules.js"></script>
<script src="src/state.js"></script>
<script src="src/render.js"></script>
<script src="src/select.js"></script>
<script src="src/spawn.js"></script>
<script src="src/combat.js"></script>
<script src="src/progress.js"></script>
<script src="src/tap.js"></script>
<script src="src/mana.js"></script>
<script src="src/autoRules.js"></script>
<script src="src/autoPanel.js"></script>
<script src="src/sheets.js"></script>
<script src="src/main.js"></script>
</body>
</html>
