<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>放置 ARPG 介面樣板 10051618</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D8D4CB; --panel:#E6E2DA; --line:#9C9384; --ink:#211C17; --soft:#645A4E;
  --btn:#CFC9BE; --btnInk:#211C17; --gold:#8C6A12; --goldBg:#C9A548;
  --life:#A8352C; --exp:#8C6A12;
  --n:#4F483F; --m:#2F55B5; --r:#8C6A00; --u:#A0501C; --ok:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181B; --panel:#1F2226; --line:#55575B; --ink:#E7E3DA; --soft:#9A968D;
    --btn:#DCDAD5; --btnInk:#1A1A1A; --gold:#E2C26A; --goldBg:#B8963E;
    --life:#C23A30; --exp:#C9A04A;
    --n:#D9D5CC; --m:#8FA8F2; --r:#EBCB5C; --u:#E0925A; --ok:#5BD15F;
  }
}
:root[data-theme="dark"]{
  --bg:#16181B; --panel:#1F2226; --line:#55575B; --ink:#E7E3DA; --soft:#9A968D;
  --btn:#DCDAD5; --btnInk:#1A1A1A; --gold:#E2C26A; --goldBg:#B8963E;
  --life:#C23A30; --exp:#C9A04A;
  --n:#D9D5CC; --m:#8FA8F2; --r:#EBCB5C; --u:#E0925A; --ok:#5BD15F;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:15px;line-height:1.45;height:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:0 8px 16px}
.n{color:var(--n)} .m{color:var(--m)} .r{color:var(--r)} .u{color:var(--u)}
.num{font-variant-numeric:tabular-nums}

/* 頂部資源列 */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;gap:8px}
.top .name{padding-right:10px;border-right:1px solid var(--line);font-weight:700}
.top .res{display:flex;justify-content:space-around;font-size:14px}
.rect{border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:14px}

/* 面板 */
.panel{border:1px solid var(--line);border-radius:3px;margin-top:8px;padding:10px;position:relative;background:var(--panel)}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--line)}
.panel::before{top:3px;left:3px;border-right:0;border-bottom:0}
.panel::after{bottom:3px;right:3px;border-left:0;border-top:0}
.title{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0 2px;font-size:15px;letter-spacing:.15em}
.title::before,.title::after{content:"";flex:0 1 90px;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.title::after{background:linear-gradient(270deg,transparent,var(--line))}
.title span::before,.title span::after{content:"◇";color:var(--soft);font-size:11px;margin:0 6px}

/* 戰鬥區 */
.units{display:flex;justify-content:space-around;gap:10px}
.unit{width:44%;border:1px solid var(--line);border-radius:3px;padding:3px;text-align:center;font-size:13px}
.unit .nm{font-weight:700}
.hpb{position:relative;height:16px;background:var(--bg);border:1px solid var(--line);margin-top:2px}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--life);transition:width .2s}
.hpb span{position:relative;font-size:12px;line-height:14px;color:#fff;text-shadow:0 0 2px #000}
.unit small{display:block;font-size:11px;color:var(--soft)}
.feed{height:62px;overflow:hidden;text-align:center;font-size:13px;margin:6px 0;color:var(--soft)}
.feed p{animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.feed p{animation:none}}
.stagec{text-align:center;font-size:15px;line-height:1.3}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.btn{background:var(--btn);color:var(--btnInk);border-radius:3px;padding:7px 10px;font-weight:700;text-align:center}
.btn.gold{background:var(--goldBg);color:#2a1e05;border:1px solid var(--gold)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.check{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;white-space:nowrap}
.check input{width:20px;height:20px;accent-color:var(--gold)}

/* 圓形選單 */
.rounds{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.round{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--line);font-size:17px;font-weight:700;background:var(--panel)}
.round.hot{color:var(--ok)}

/* 屬性 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:15px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.stats span:first-child{color:var(--soft)}

/* 裝備紙娃娃 */
.doll{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;padding:10px 0}
.slot{display:grid;place-items:center;height:78px;position:relative}
.slot::before{content:"";position:absolute;width:56px;height:56px;border:1px solid var(--line);transform:rotate(45deg);background:var(--bg)}
.slot.has::before{border-width:2px}
.slot.has.m::before{border-color:var(--m)} .slot.has.r::before{border-color:var(--r)} .slot.has.n::before{border-color:var(--n)}
.slot.off{opacity:.35}
.slot b{position:relative;font-size:13px;line-height:1.2;text-align:center;max-width:84px}
.slot b small{display:block;font-size:10px;color:var(--soft);font-weight:500}

/* 底部列 */
.bottom{display:flex;gap:8px;margin-top:12px}
.bottom .btn{flex:1}

/* 彈出層 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-bottom:0;width:100%;max-width:460px;max-height:85%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border-radius:8px 8px 0 0}
.box h3{font-size:18px}
.affix{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.affix span:last-child{color:var(--soft);font-size:12px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.list button{display:flex;justify-content:space-between;width:100%;padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.hint{font-size:12px;color:var(--soft);margin-top:8px}

/* 天賦樹（全螢幕） */
.treePage{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.treePage[hidden]{display:none}
.treeHead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.canvas{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 50%,var(--panel),var(--bg) 70%)}
.canvas svg{width:100%;height:100%;display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font-size:18px}
.treeInfo{border-top:1px solid var(--line);padding:10px;min-height:96px;font-size:14px}
.treeInfo h4{font-size:16px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="name">流放者</span>
    <span class="res num"><span>經驗:<b id="exp">0</b></span><span>金幣:<b id="gold">0</b></span><span>重擲石:<b id="orb">5</b></span></span>
    <button class="rect" data-open="setSheet">設置</button>
  </div>

  <div class="panel">
    <div class="units">
      <div class="unit"><div class="nm m">流放者・劍士</div><div class="hpb"><i id="hhp"></i><span id="hhpt" class="num"></span></div><small>Lv <span id="lv">1</span></small></div>
      <div class="unit"><div class="nm" id="mname">腐屍</div><div class="hpb"><i id="mhp"></i><span id="mhpt" class="num"></span></div><small id="mtag">普通</small></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="stagec num"><span id="kills">0</span>/20<br>第 <span id="stage">1</span> 關</div>
    <div class="ctrl">
      <button class="btn line" id="potBtn">藥水 <span id="pot" class="num">5</span></button>
      <label class="check"><input type="checkbox" id="autoBoss"> 自動挑戰</label>
      <button class="btn gold" id="bossBtn">挑戰首領</button>
    </div>
  </div>

  <div class="rounds">
    <button class="round hot" data-open="bagSheet">背包</button>
    <button class="round" id="treeBtn">天賦</button>
    <button class="round" data-open="autoSheet">自動</button>
    <button class="round" data-open="shopSheet">商店</button>
  </div>

  <div class="title"><span>角色屬性</span></div>
  <div class="panel"><div class="stats num" id="stats"></div></div>

  <div class="title"><span>裝備配置</span></div>
  <div class="panel"><div class="doll" id="doll"></div>
    <p class="hint">點格子看裝備。拿雙手武器時副手會停用。</p></div>

  <div class="bottom">
    <button class="btn line" data-open="logSheet">戰鬥紀錄</button>
    <button class="btn line" data-open="questSheet">任務</button>
  </div>
</div>

<!-- 彈出層 -->
<div class="sheet" id="itemSheet" hidden><div class="box" id="itemBox"></div></div>
<div class="sheet" id="bagSheet" hidden><div class="box"><h3>背包</h3><div class="list" id="bagList"></div><div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>
<div class="sheet" id="autoSheet" hidden><div class="box"><h3>自動規則</h3>
  <div class="affix"><span>生命低於 <b id="potv">40%</b> 喝藥水</span></div>
  <input type="range" id="potr" min="10" max="80" step="5" value="40" style="width:100%;accent-color:var(--life)">
  <div class="affix"><label><input type="checkbox" id="sellN" checked> 自動賣掉普通裝備</label></div>
  <div class="affix"><label><input type="checkbox" id="sellM"> 自動賣掉魔法裝備</label></div>
  <div class="affix"><label><input type="checkbox" id="buyP" checked> 藥水用完自動補（10 金幣一瓶）</label></div>
  <div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>
<div class="sheet" id="shopSheet" hidden><div class="box"><h3>商店</h3>
  <div class="list"><button id="buyOrb"><span>重擲石 ×1</span><span>50 金幣</span></button><button id="buyPot"><span>藥水 ×5</span><span>40 金幣</span></button></div>
  <div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>
<div class="sheet" id="logSheet" hidden><div class="box"><h3>戰鬥紀錄</h3><div class="list" id="logList"></div><div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>
<div class="sheet" id="questSheet" hidden><div class="box"><h3>任務</h3><p class="hint">樣板先留位置：之後放「通關第 5 關」「學 10 個天賦」這類有獎勵的任務。</p><div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>
<div class="sheet" id="setSheet" hidden><div class="box"><h3>設置</h3><p class="hint">之後放：存檔匯出／匯入、音效、清除資料。</p><div class="acts"><button class="btn line" data-close>關閉</button></div></div></div>

<!-- 天賦樹 -->
<div class="treePage" id="treePage" hidden>
  <div class="treeHead"><b>天賦樹　剩 <span id="pts" class="num">0</span> 點</b><span><button class="rect" id="resetTree">全部退回</button> <button class="rect" id="treeClose">返回</button></span></div>
  <div class="canvas" id="canvas">
    <svg id="svg"><g id="world"></g></svg>
    <div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zfit" aria-label="回到中心">◎</button></div>
  </div>
  <div class="treeInfo" id="treeInfo">一指拖曳平移，兩指縮放。點天賦看說明，再按「學習」或「退回」。</div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ───── 裝備資料 ───── */
const SLOTS=[ // 紙娃娃排列
 ["weapon","武器"],["helm","頭部"],["offhand","副手"],
 ["gloves","手套"],["body","胸甲"],["amulet","項鍊"],
 ["ring1","戒指"],["belt","腰帶"],["ring2","戒指"],
 [null,""],["boots","鞋子"],[null,""]];
const SLOTNAME={...Object.fromEntries(SLOTS.filter(s=>s[0])),ring:"戒指"};
const fits=(it,k)=>k===it.slot||(it.slot==="ring"&&(k==="ring1"||k==="ring2"));
const eqKey=it=>Object.keys(S.equip).find(k=>S.equip[k]===it);
const BASES=[
 {slot:"weapon",name:"鏽蝕長劍",hand:1,imp:{dmg:4}},{slot:"weapon",name:"伐木巨斧",hand:2,imp:{dmg:9}},
 {slot:"offhand",name:"木製圓盾",kind:"防具",imp:{armor:12}},{slot:"offhand",name:"彎刃短刀",kind:"武器",imp:{dmg:2}},
 {slot:"helm",name:"鐵皮頭盔",imp:{armor:8}},{slot:"body",name:"縫補鎖甲",imp:{armor:18}},
 {slot:"gloves",name:"皮革手套",imp:{eva:6}},{slot:"boots",name:"布綁腿靴",imp:{eva:8}},
 {slot:"amulet",name:"骨片項鍊",imp:{}},{slot:"ring",name:"黃銅戒指",imp:{}},{slot:"belt",name:"粗皮腰帶",imp:{life:10}}];
const AFFIX=[
 {id:"dmg",kind:"前綴",text:"+{v} 攻擊傷害",slots:["weapon","offhand","gloves","ring","amulet"],tiers:[[1,1,2,4],[2,6,5,8],[3,12,9,14]]},
 {id:"life",kind:"前綴",text:"+{v} 最大生命",slots:["helm","body","gloves","boots","belt","ring","amulet","offhand"],tiers:[[1,1,8,15],[2,6,16,28],[3,12,29,45]]},
 {id:"armor",kind:"前綴",text:"+{v} 護甲",slots:["helm","body","gloves","boots","offhand","belt"],tiers:[[1,1,6,12],[2,6,13,24],[3,12,25,40]]},
 {id:"spd",kind:"後綴",text:"+{v}% 攻擊速度",slots:["weapon","gloves","ring"],tiers:[[1,1,3,6],[2,7,7,11],[3,14,12,16]]},
 {id:"crit",kind:"後綴",text:"+{v}% 暴擊率",slots:["weapon","amulet","ring","helm"],tiers:[[1,1,2,4],[2,8,5,8]]},
 {id:"res",kind:"後綴",text:"+{v}% 全抗性",slots:["helm","body","boots","belt","ring","amulet","offhand"],tiers:[[1,1,4,8],[2,8,9,15]]},
 {id:"eva",kind:"後綴",text:"+{v} 閃避",slots:["boots","gloves","body","helm"],tiers:[[1,1,5,10],[2,7,11,20]]}
];
const RAR={n:"普通",m:"魔法",r:"稀有"};

function rollAffixes(it){
  const n=it.rar==="n"?0:it.rar==="m"?rnd(1,2):rnd(3,4);
  const pool=AFFIX.filter(a=>a.slots.includes(it.slot)); it.affixes=[];
  for(let i=0;i<n&&pool.length;i++){
    const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const t=pick(a.tiers.filter(t=>t[1]<=it.ilvl));
    it.affixes.push({id:a.id,kind:a.kind,text:a.text,tier:t[0],v:rnd(t[2],t[3])});
  }
}
function makeItem(ilvl){
  const b=pick(BASES); const x=Math.random(); const rar=x<.55?"n":x<.88?"m":"r";
  const it={uid:Math.random().toString(36).slice(2),...b,imp:{...b.imp},ilvl,rar}; rollAffixes(it); return it;
}

/* ───── 星狀天賦樹（程式產生） ───── */
const ARMS=[
 {name:"力量",area:"物理傷害",color:"#C0503A",stat:"dmg",val:2,unit:"攻擊傷害",note:["蠻力","+15% 攻擊傷害","dmgPct",15],key:["巨人之力","攻擊傷害 +40%，攻擊速度 -15%"]},
 {name:"生命",area:"生命恢復",color:"#4E9A52",stat:"life",val:10,unit:"最大生命",note:["堅韌","+12% 最大生命","lifePct",12],key:["不動如山","生命 +30%，無法閃避"]},
 {name:"敏捷",area:"攻擊速度",color:"#3C8FA8",stat:"spd",val:3,unit:"% 攻擊速度",note:["迅捷","+8% 攻擊速度","spd",8],key:["殘影","攻擊速度 +25%，生命 -15%"]},
 {name:"精準",area:"暴擊",color:"#B08A2E",stat:"crit",val:2,unit:"% 暴擊率",note:["致命","+6% 暴擊率","crit",6],key:["處決","暴擊傷害 3 倍，無暴擊時傷害 -20%"]},
 {name:"守護",area:"護甲格擋",color:"#7A7A86",stat:"armor",val:10,unit:"護甲",note:["鐵壁","+20% 護甲","armorPct",20],key:["荊棘","受到攻擊時反彈 30% 傷害"]},
 {name:"元素",area:"元素抗性",color:"#7A5AB8",stat:"res",val:4,unit:"% 全抗性",note:["淨化","+10% 全抗性","res",10],key:["元素親和","全抗性上限 +10%"]}
];
const NODES=[{id:0,x:0,y:0,type:"start",name:"起點",desc:"所有路線從這裡開始",stat:{}}]; const LINKS=[];
ARMS.forEach((a,k)=>{
  const ang=(k*60-90)*Math.PI/180, ux=Math.cos(ang), uy=Math.sin(ang), px=-uy, py=ux;
  const add=(r,off,type,name,desc,stat)=>{const id=NODES.length;NODES.push({id,x:ux*r+px*off,y:uy*r+py*off,type,name,desc,stat,arm:k});return id;};
  const s={[a.stat]:a.val};
  const n1=add(70,0,"small",a.name,`+${a.val} ${a.unit}`,s), n2=add(130,0,"small",a.name,`+${a.val} ${a.unit}`,s);
  const side=add(165,46,"small",a.name,`+${a.val} ${a.unit}`,s);
  const n3=add(195,0,"small",a.name,`+${a.val} ${a.unit}`,s);
  const nt=add(265,0,"notable",a.note[0],a.note[1],{[a.note[2]]:a.note[3]});
  const ks=add(345,0,"keystone",a.key[0],a.key[1],{key:a.key[0]});
  LINKS.push([0,n1],[n1,n2],[n2,n3],[n2,side],[n3,nt],[nt,ks]);
  a.ring=n2;
});
ARMS.forEach((a,k)=>{ // 環狀連結：相鄰兩條路線中間加一個點
  const b=ARMS[(k+1)%6]; const A=NODES[a.ring],B=NODES[b.ring];
  const id=NODES.length; NODES.push({id,x:(A.x+B.x)/2*1.15,y:(A.y+B.y)/2*1.15,type:"small",name:"連接",desc:"+5 最大生命",stat:{life:5}});
  LINKS.push([a.ring,id],[id,b.ring]);
});

/* ───── 狀態 ───── */
const S={lv:1,exp:0,gold:120,orb:5,pot:5,hp:80,stage:1,kills:0,bossFight:false,
  equip:Object.fromEntries(SLOTS.filter(s=>s[0]).map(s=>[s[0],null])),bag:[],tree:new Set([0]),bonusPts:10,mon:null,log:[]};

function calc(){
  let st={dmg:5,life:80,armor:0,eva:0,spd:0,crit:5,res:0,dmgPct:0,lifePct:0,armorPct:0};
  for(const it of Object.values(S.equip)){ if(!it)continue;
    for(const[k,v]of Object.entries(it.imp))st[k]+=v; for(const a of it.affixes)st[a.id]+=a.v; }
  for(const id of S.tree){ for(const[k,v]of Object.entries(NODES[id].stat)) if(k!=="key")st[k]=(st[k]||0)+v; }
  st.life=Math.round(st.life*(1+st.lifePct/100)); st.dmg=Math.round(st.dmg*(1+st.dmgPct/100)); st.armor=Math.round(st.armor*(1+st.armorPct/100));
  st.interval=Math.round(1000/(1+st.spd/100)); st.dps=(st.dmg*(1+st.crit/100)*1000/st.interval);
  return st;
}
function newMon(boss){
  const s=S.stage, names=["腐屍","灰燼獵犬","骨弓手","沼澤蟲","荒原劫匪"];
  const hp=boss?(60+s*40):(20+s*10);
  S.mon={name:boss?"墓穴守衛":pick(names),max:hp,hp,atk:(boss?5:2)+Math.floor(s*1.7),boss,ilvl:Math.min(16,s+1)};
}
function feed(t,cls=""){
  const p=document.createElement("p"); p.className=cls; p.textContent=t; const f=$("feed"); f.prepend(p); while(f.children.length>3)f.lastChild.remove();
  S.log.unshift({t,cls}); S.log=S.log.slice(0,40);
}
let lastHit=0;
function tick(){
  const st=calc(), now=Date.now();
  if(now-lastHit>=st.interval){ lastHit=now; const c=Math.random()*100<st.crit; S.mon.hp-=c?st.dmg*2:st.dmg; if(S.mon.hp<=0)kill(); }
  if(Math.random()<.5){ const raw=S.mon.atk*.5; S.hp-=raw*100/(100+st.armor); }
  S.hp=Math.min(st.life,S.hp+.15);
  if(S.hp/st.life*100<+$("potr").value){
    if(S.pot>0){S.pot--;S.hp=Math.min(st.life,S.hp+st.life*.5);}
    else if($("buyP").checked&&S.gold>=10){S.gold-=10;S.pot++;} }
  if(S.hp<=0){ S.hp=st.life; if(S.mon.boss){feed("挑戰失敗，回到本關","r");S.kills=0;} newMon(false); }
  render();
}
function kill(){
  const m=S.mon; S.gold+=rnd(2,5)*S.stage*(m.boss?5:1); S.exp+=(6+S.stage*3)*(m.boss?5:1);
  feed(`獲得 金幣、經驗`);
  if(m.boss){ S.stage++; S.kills=0; feed(`通過第 ${S.stage-1} 關`,"r"); }
  else S.kills=Math.min(20,S.kills+1);
  if(Math.random()<(m.boss?1:.06)){S.orb++;feed("獲得 重擲石 ×1","m");}
  if(Math.random()<(m.boss?1:.3)){ const it=makeItem(m.ilvl); if(m.boss&&it.rar==="n")it.rar="m",rollAffixes(it);
    if((it.rar==="n"&&$("sellN").checked)||(it.rar==="m"&&$("sellM").checked)){S.gold+=it.rar==="n"?3:8;}
    else{S.bag.unshift(it);S.bag=S.bag.slice(0,30);feed(`獲得 ${RAR[it.rar]}・${it.name}`,it.rar);} }
  const need=40+S.lv*30; if(S.exp>=need){S.exp-=need;S.lv++;feed(`升到 Lv ${S.lv}，天賦點 +1`,"r");}
  newMon(S.kills>=20&&$("autoBoss").checked);
}
function points(){return S.lv-1+S.bonusPts-(S.tree.size-1);}

/* ───── 畫面 ───── */
function render(){
  const st=calc();
  $("exp").textContent=S.exp; $("gold").textContent=S.gold; $("orb").textContent=S.orb; $("pot").textContent=S.pot; $("lv").textContent=S.lv;
  $("hhp").style.width=Math.max(0,S.hp/st.life*100)+"%"; $("hhpt").textContent=Math.max(0,Math.round(S.hp));
  $("mname").textContent=S.mon.name; $("mname").className="nm "+(S.mon.boss?"u":"");
  $("mtag").textContent=S.mon.boss?"首領":"普通";
  $("mhp").style.width=Math.max(0,S.mon.hp/S.mon.max*100)+"%"; $("mhpt").textContent=Math.max(0,Math.round(S.mon.hp));
  $("kills").textContent=S.kills; $("stage").textContent=S.stage;
  $("bossBtn").disabled=S.kills<20||S.mon.boss;
  $("stats").innerHTML=[["攻擊",st.dmg],["生命",st.life],["護甲",st.armor],["閃避",st.eva],["攻速",(1000/st.interval).toFixed(2)+"/秒"],["暴擊",st.crit+"%"],["全抗性",st.res+"%"],["每秒傷害",st.dps.toFixed(1)]]
    .map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join("");
  $("pts").textContent=points();
}
function renderDoll(){
  const twoH=S.equip.weapon&&S.equip.weapon.hand===2;
  $("doll").innerHTML=SLOTS.map(([k,nm])=>{ if(!k)return '<div></div>'; const it=S.equip[k]; const off=k==="offhand"&&twoH;
    return `<button class="slot ${it?"has "+it.rar:""} ${off?"off":""}" data-slot="${k}" ${off?"disabled":""}>
      <b class="${it?it.rar:""}">${it?it.name:nm}${it?`<small>${nm}</small>`:off?"<small>雙手武器</small>":""}</b></button>`}).join("");
}
function itemHTML(it){
  const imp=Object.entries(it.imp).map(([k,v])=>({dmg:"攻擊傷害",armor:"護甲",eva:"閃避",life:"最大生命"}[k]+" +"+v)).join("、");
  const sub=it.slot==="weapon"?(it.hand===2?"雙手":"單手"):it.slot==="offhand"?it.kind:"";
  return `<h3 class="${it.rar}">${it.name}</h3>
   <p class="hint" style="margin-top:2px">${RAR[it.rar]}・${SLOTNAME[it.slot]}${sub?"（"+sub+"）":""}　物品等級 ${it.ilvl}${imp?"<br>固定："+imp:""}</p>
   ${it.affixes.map(a=>`<div class="affix"><span>${a.text.replace("{v}",a.v)}</span><span>${a.kind} 第 ${a.tier} 階</span></div>`).join("")||'<div class="affix"><span class="hint">沒有詞綴</span></div>'}`;
}
let cur=null;
function openItem(it,fromSlot){
  cur=it; const ek=eqKey(it), equipped=!!ek;
  const target=fromSlot&&fits(it,fromSlot)?fromSlot:it.slot==="ring"?(S.equip.ring1?(S.equip.ring2?"ring1":"ring2"):"ring1"):it.slot;
  $("itemBox").innerHTML=itemHTML(it)+`<div class="acts">
    ${equipped?`<button class="btn line" id="aUn">卸下</button>`:`<button class="btn" id="aEq">裝備</button>`}
    <button class="btn line" id="aRoll" ${S.orb<1||it.rar==="n"?"disabled":""}>重擲詞綴（重擲石 ${S.orb}）</button>
    ${equipped?"":`<button class="btn line" id="aSell">賣掉</button>`}
    ${fromSlot?`<button class="btn line" id="aSwap">從背包換一件</button>`:""}
    <button class="btn line" data-close>關閉</button></div>`;
  show("itemSheet");
  $("aEq")&&($("aEq").onclick=()=>{ if(it.slot==="offhand"&&S.equip.weapon&&S.equip.weapon.hand===2){alert("拿雙手武器時不能裝副手");return;}
    const old=S.equip[target]; S.equip[target]=it; S.bag=S.bag.filter(x=>x!==it); if(old)S.bag.unshift(old);
    if(it.hand===2&&S.equip.offhand){S.bag.unshift(S.equip.offhand);S.equip.offhand=null;}
    hide("itemSheet"); renderDoll(); render(); });
  $("aUn")&&($("aUn").onclick=()=>{S.equip[ek]=null;S.bag.unshift(it);hide("itemSheet");renderDoll();render();});
  $("aRoll").onclick=()=>{S.orb--;rollAffixes(it);openItem(it,fromSlot);render();renderDoll();};
  $("aSell")&&($("aSell").onclick=()=>{S.bag=S.bag.filter(x=>x!==it);S.gold+=it.rar==="r"?20:it.rar==="m"?8:3;hide("itemSheet");render();});
  $("aSwap")&&($("aSwap").onclick=()=>{hide("itemSheet");openBag(ek);});
}
let bagSlot=null;
function openBag(slot){
  bagSlot=slot||null; const list=slot?S.bag.filter(i=>fits(i,slot)):S.bag;
  $("bagList").innerHTML=list.length?list.map(i=>`<button data-uid="${i.uid}"><span class="${i.rar}">${i.name}</span><span class="hint" style="margin:0">${SLOTNAME[i.slot]}・${i.affixes.length} 詞綴</span></button>`).join("")
    :`<p class="hint">${slot?SLOTNAME[slot]+"沒有可換的裝備，繼續打怪吧。":"背包是空的。"}</p>`;
  show("bagSheet");
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-slot]"); if(s){const k=s.dataset.slot; S.equip[k]?openItem(S.equip[k],k):openBag(k);}
  const u=e.target.closest("[data-uid]"); if(u){hide("bagSheet");openItem(S.bag.find(i=>i.uid===u.dataset.uid),bagSlot);}
  const o=e.target.closest("[data-open]"); if(o){const id=o.dataset.open; if(id==="bagSheet")openBag(); else if(id==="logSheet"){$("logList").innerHTML=S.log.map(l=>`<button><span class="${l.cls}">${l.t}</span></button>`).join("");show(id);} else show(id);}
  if(e.target.closest("[data-close]"))e.target.closest(".sheet").hidden=true;
  if(e.target.classList.contains("sheet"))e.target.hidden=true;
});
const show=id=>$(id).hidden=false, hide=id=>$(id).hidden=true;
$("potr").oninput=e=>$("potv").textContent=e.target.value+"%";
$("potBtn").onclick=()=>{const st=calc(); if(S.pot>0){S.pot--;S.hp=Math.min(st.life,S.hp+st.life*.5);render();}};
$("bossBtn").onclick=()=>{newMon(true);feed("挑戰首領！","u");render();};
$("buyOrb").onclick=()=>{if(S.gold>=50){S.gold-=50;S.orb++;render();}};
$("buyPot").onclick=()=>{if(S.gold>=40){S.gold-=40;S.pot+=5;render();}};

/* ───── 天賦樹：平移、縮放、點選 ───── */
const V={x:0,y:0,k:1};
const svg=$("svg"), world=$("world");
function size(){const r=svg.getBoundingClientRect();return{w:r.width,h:r.height};}
function applyV(){const{w,h}=size(); world.setAttribute("transform",`translate(${w/2+V.x},${h/2+V.y}) scale(${V.k})`);}
function canLearn(id){return !S.tree.has(id)&&LINKS.some(([a,b])=>(a===id&&S.tree.has(b))||(b===id&&S.tree.has(a)));}
function drawTree(){
  const R={start:16,small:9,notable:15,keystone:21};
  let h=ARMS.map((a,k)=>{ // 扇形底色＋方向標示
    const c=(k*60-90)*Math.PI/180, a0=c-Math.PI/6, a1=c+Math.PI/6, r=470;
    const sec=`<path d="M0 0 L${r*Math.cos(a0)} ${r*Math.sin(a0)} A${r} ${r} 0 0 1 ${r*Math.cos(a1)} ${r*Math.sin(a1)} Z" fill="${a.color}" opacity=".10"/>`;
    const lx=430*Math.cos(c), ly=430*Math.sin(c);
    return sec+`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="30" font-weight="900" fill="${a.color}" opacity=".55" letter-spacing="4">${a.area}</text>`;
  }).join("");
  h+=LINKS.map(([a,b])=>{const A=NODES[a],B=NODES[b],on=S.tree.has(a)&&S.tree.has(b);
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${on?"var(--gold)":"var(--line)"}" stroke-width="${on?3:1.5}"/>`}).join("");
  h+=NODES.map(n=>{const on=S.tree.has(n.id),can=canLearn(n.id);
    const shape=n.type==="keystone"?`<rect x="${-R.keystone}" y="${-R.keystone}" width="${R.keystone*2}" height="${R.keystone*2}" transform="rotate(45)"`:`<circle r="${R[n.type]}"`;
    return `<g transform="translate(${n.x},${n.y})" data-node="${n.id}" style="cursor:pointer">${selNode===n.id?`<circle r="${R[n.type]+8}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`:""}
      ${shape} fill="${on?"var(--goldBg)":"var(--panel)"}" stroke="${on||can?"var(--gold)":"var(--line)"}" stroke-width="${n.type==="small"?1.5:2.5}" ${can?'stroke-dasharray="3 2"':""}/>
      ${n.type!=="small"?`<text y="${R[n.type]+14}" text-anchor="middle" font-size="12" fill="var(--ink)">${n.name}</text>`:""}</g>`}).join("");
  world.innerHTML=h; applyV();
}
function canRefund(id){ // 退回後，其他已學的天賦還要連得回起點
  if(id===0||!S.tree.has(id))return false;
  const keep=new Set([...S.tree].filter(x=>x!==id)), seen=new Set([0]), q=[0];
  while(q.length){const c=q.pop(); for(const[a,b]of LINKS){const o=a===c?b:b===c?a:null; if(o!==null&&keep.has(o)&&!seen.has(o)){seen.add(o);q.push(o);}}}
  return seen.size===keep.size;
}
let selNode=null;
function tapNode(id,msg=""){
  selNode=id; const n=NODES[id], info=$("treeInfo"), tag={start:"",small:"小天賦",notable:"大天賦",keystone:"核心天賦"}[n.type];
  let act="";
  if(id===0)msg=msg||"起點不能退回";
  else if(S.tree.has(id)) act=canRefund(id)?`<button class="btn line" id="tRefund">退回這個天賦（+1 點）</button>`:`<p class="hint">要先退回外側的天賦，才能退這個</p>`;
  else if(!canLearn(id)) act=`<p class="hint">要先學相鄰的天賦</p>`;
  else act=points()<1?`<p class="hint">天賦點不夠，升級後再來</p>`:`<button class="btn" id="tLearn">學習（剩 ${points()} 點）</button>`;
  info.innerHTML=`<h4>${n.name}　<span class="hint">${tag}${S.tree.has(id)&&id?"・已學":""}</span></h4>${n.desc}<div class="acts" style="margin-top:8px">${act}</div>${msg?`<p class="hint">${msg}</p>`:""}`;
  $("tLearn")&&($("tLearn").onclick=()=>{S.tree.add(id);drawTree();render();tapNode(id,"學會了");});
  $("tRefund")&&($("tRefund").onclick=()=>{S.tree.delete(id);drawTree();render();tapNode(id,"已退回");});
  drawTree();
}
$("resetTree").onclick=()=>{S.tree=new Set([0]);drawTree();render();$("treeInfo").textContent="全部退回了。";};
const P=new Map(); let start=null, moved=false;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false; start={V:{...V},pts:[...P.values()].map(p=>({...p})),node:e.target.closest("[data-node]")};});
svg.addEventListener("pointermove",e=>{ if(!P.has(e.pointerId))return; P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...P.values()];
  if(pts.length===1&&start.pts.length===1){const dx=pts[0].x-start.pts[0].x,dy=pts[0].y-start.pts[0].y;
    if(Math.hypot(dx,dy)>5)moved=true; if(moved){V.x=start.V.x+dx;V.y=start.V.y+dy;applyV();}}
  else if(pts.length===2){ if(start.pts.length!==2){start={V:{...V},pts:pts.map(p=>({...p}))};}
    moved=true; const d0=Math.hypot(start.pts[0].x-start.pts[1].x,start.pts[0].y-start.pts[1].y), d1=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    zoomAt(start.V,d1/d0,(pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2,(start.pts[0].x+start.pts[1].x)/2,(start.pts[0].y+start.pts[1].y)/2);}
});
function zoomAt(v0,f,cx,cy,sx,sy){ // 以手指中心縮放
  const r=svg.getBoundingClientRect(), k=Math.min(3,Math.max(.4,v0.k*f)), real=k/v0.k;
  const ox=sx-r.left-r.width/2, oy=sy-r.top-r.height/2;
  V.k=k; V.x=(cx-r.left-r.width/2)-(ox-v0.x)*real; V.y=(cy-r.top-r.height/2)-(oy-v0.y)*real; applyV();
}
const endP=e=>{ if(!P.has(e.pointerId))return; P.delete(e.pointerId);
  if(!moved&&P.size===0&&start&&start.node)tapNode(+start.node.dataset.node);
  if(P.size===1)start={V:{...V},pts:[...P.values()].map(p=>({...p}))}; };
svg.addEventListener("pointerup",endP); svg.addEventListener("pointercancel",endP);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt({...V},e.deltaY<0?1.12:.89,e.clientX,e.clientY,e.clientX,e.clientY);},{passive:false});
const zc=f=>{const r=svg.getBoundingClientRect();zoomAt({...V},f,r.left+r.width/2,r.top+r.height/2,r.left+r.width/2,r.top+r.height/2);};
$("zin").onclick=()=>zc(1.25); $("zout").onclick=()=>zc(.8); $("zfit").onclick=()=>{V.x=0;V.y=0;V.k=.8;applyV();};
$("treeBtn").onclick=()=>{show("treePage");V.x=0;V.y=0;V.k=.8;drawTree();};
$("treeClose").onclick=()=>hide("treePage");
window.addEventListener("resize",applyV);

newMon(false); renderDoll(); render(); feed("戰鬥開始"); setInterval(tick,100);
</script>
</body>
</html>
